name: language-tts-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: node --check app-tts.js && node --check app-init.js
      - name: Language and voice tests
        run: node tests/language-tts.test.cjs
      - name: Delayed French voice browser mock
        run: node tests/tts-browser-mock.test.cjs
