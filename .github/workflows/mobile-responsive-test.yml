name: mobile-responsive-test

on:
  push:
    branches: ['fix/mobile-responsive']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check app-mobile.js && node --check app-auth.js
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/leitura-http.log 2>&1 &
      - name: Responsive browser test
        run: node tests/mobile-responsive.test.mjs
