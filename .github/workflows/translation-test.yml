name: Translation Test

on:
  push:
    branches:
      - fix/translation-fallback
  pull_request:
    paths:
      - 'api/translate.js'
      - 'tests/translation.test.js'
      - '.github/workflows/translation-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check api/translate.js
      - name: Translation tests
        run: node --test tests/translation.test.js
