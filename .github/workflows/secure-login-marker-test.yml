name: Secure Login and Marker Test

on:
  push:
    branches:
      - feature/secure-login-marker-resume
  pull_request:
    paths:
      - 'app-auth.js'
      - 'auth-crypto.js'
      - 'app-reading-tools.js'
      - 'app-init.js'
      - 'api/auth/**'
      - 'api/_auth.js'
      - 'tests/auth-crypto.test.js'
      - 'tests/reading-tools.test.js'
      - '.github/workflows/secure-login-marker-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check app-auth.js
          node --check auth-crypto.js
          node --check app-reading-tools.js
          node --check app-init.js
          node --check api/_auth.js
          node --check api/auth/challenge.js
          node --check api/auth/login.js
          node --check api/auth/session.js
          node --check api/auth/logout.js
      - name: Functional tests
        run: node --test tests/auth-crypto.test.js tests/reading-tools.test.js
      - name: Check auth challenge is reachable
        run: |
          node - <<'NODE'
          const url = 'https://cahfjsfxlvvfjehdizsb.supabase.co/functions/v1/leitura-auth';
          const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({action:'challenge'})});
          const data = await r.json();
          if (!r.ok || !data.challengeId || !data.serverPublicKey || data.protocol !== 'ECDH-P256/AES-256-GCM') {
            console.error(r.status, data);
            process.exit(1);
          }
          console.log('challenge-ok', data.protocol);
          NODE
